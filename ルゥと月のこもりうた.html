<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ルゥと月のこもりうた</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{
  --night:#2b2a5c; --paper:#fffaf0; --card:#fff; --ink:#4a3048; --muted:#8a7590;
  --berry:#ff6f91; --pink:#ff8fb1; --gold:#ffd36e; --mint:#8fe0cf; --line:#ecdcc8; --page:#1c1b45;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--page);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#2a2547; --card:#38315f; --ink:#f6eeff; --muted:#bfb2d6; --line:#4a4176; --page:#0f0e2a; } }
:root[data-theme="dark"]{ --paper:#2a2547; --card:#38315f; --ink:#f6eeff; --muted:#bfb2d6; --line:#4a4176; --page:#0f0e2a; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.4)}
#stage{position:relative;flex:0 0 auto;height:min(50%,78vw,400px);min-height:210px;overflow:hidden;background:#1f2257;user-select:none}
#bg,#layer,#fx{position:absolute;inset:0}
#bg svg{width:100%;height:100%;display:block}
#fx{pointer-events:none;background:#fff;opacity:0}
#fx.flash{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#stage.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
#stage::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:14px;background:radial-gradient(circle at 10px -2px,transparent 9px,var(--paper) 10px) 0 0/20px 14px repeat-x;pointer-events:none}

#panel{flex:1;overflow-y:auto;padding:16px 14px 18px;-webkit-overflow-scrolling:touch}
h1,h2,h3,.nm,.tab{font-family:"Yusei Magic","Zen Maru Gothic",sans-serif;font-weight:400}

/* title */
.titlecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff6d8;padding:0 12px}
.titlecard{padding-top:8%}
.titlecard h1{margin:0;font-size:clamp(34px,10vw,52px);line-height:1.15;letter-spacing:.06em;text-shadow:0 2px 0 #4b3f8f,0 0 22px rgba(255,214,110,.75);transform:rotate(-2deg)}
.titlecard.small h1{font-size:clamp(26px,8vw,38px)}
.tsub{font-size:13px;letter-spacing:.2em;margin-bottom:10px;opacity:.85}

/* dialogue */
.tb{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:22px 16px 18px;font-size:16.5px;line-height:1.85;min-height:118px;margin-top:10px;cursor:pointer}
.tb .nm{position:absolute;top:-15px;left:14px;background:var(--pink);color:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:1px 14px;font-size:15px;letter-spacing:.05em}
.tb .nm.gold{background:linear-gradient(90deg,#ffd36e,#ffb36e);color:#4a3048}
.tb.narr .tx{color:var(--ink);opacity:.82}
.tb.sys{background:#e6fbf5;border-style:dashed}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tb.sys{background:#22445a} }
.tb.louv{border-color:#e8a93a;box-shadow:0 0 0 4px rgba(255,211,110,.35),0 0 24px rgba(255,211,110,.5)}
.tb.louv .tx{font-size:19px;letter-spacing:.06em;color:#b06a12}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tb.louv .tx{color:#ffd36e} }
.tb .nx{position:absolute;right:14px;bottom:6px;font-size:12px;color:var(--berry);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.sysx{color:#2a9d8f;font-weight:700}
.por{position:absolute;bottom:-4%;width:48%;height:96%;transition:filter .25s,transform .25s;transform-origin:bottom center}
.por svg{width:100%;height:100%}
.por.L{left:1%}.por.R{right:1%}
.por.dim{filter:brightness(.62) saturate(.7);transform:scale(.93)}
.por.pop{animation:popin .32s ease-out}
@keyframes popin{0%{transform:translateY(14px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}

/* tcard overlay */
#overlay{position:fixed;inset:0;display:none;z-index:50;background:rgba(15,12,40,.62)}
#overlay.show{display:flex;align-items:flex-end;justify-content:center}
.tcard{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#3b3480,#100d2c);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff6d8;cursor:pointer;animation:fade 1.2s}
.tcard h2{font-size:clamp(30px,9vw,48px);margin:.2em 0;text-shadow:0 0 24px rgba(255,214,110,.8)}
.tcard p{font-size:13px;opacity:.7;animation:tw 2.4s infinite}
.tc-star{font-size:28px;color:var(--gold);animation:tw 2s infinite}
@keyframes fade{from{opacity:0}}

/* buttons */
.btn{font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:999px;padding:11px 16px;min-height:48px;box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.npc:focus-visible,.foe:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn small{display:block;font-size:11px;font-weight:500;opacity:.75}
.btn.pri{background:var(--pink);color:#3a1a2c}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn.sm{min-height:42px;padding:7px 10px;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.btn.dis,.btn:disabled{opacity:.42;cursor:default}
.btn.here{background:#e6fbf5}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.here{background:#2f5a60} }
.btn.li{border-radius:14px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%}
.btn.li em{font-style:normal;color:var(--berry)}
.btn.li small{grid-column:1/-1;opacity:.8}
.menu-col{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:10px 0;line-height:1.6}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.ph h3{margin:0;font-size:21px}
.gold{font-weight:700;color:#c98a1a;font-size:14px}
.say{margin:0 0 10px;font-size:14px;line-height:1.7}

/* area */
.npcs{position:absolute;left:2%;right:2%;bottom:5%;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));align-items:end;gap:1%}
.npc{min-width:0;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:inherit}
.npc svg{width:100%;max-width:96px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.npc:active svg{transform:translateY(2px)}
.npc .ico{font-size:clamp(28px,9vw,44px);line-height:1.6}
.npc .lbl{font-size:10px;background:rgba(255,250,240,.9);color:#4a3048;border-radius:8px;padding:1px 5px;margin-top:-4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.map{position:absolute;inset:0;background:#f7efd8}
.map svg{width:100%;height:100%}
.mnode{cursor:pointer}
.pulse{animation:tw 1.4s infinite}

/* dungeon */
.walk{position:absolute;left:0;right:0;bottom:4%;display:flex;justify-content:center;gap:2%}
.wk{width:24%;max-width:110px;animation:walk .7s ease-in-out infinite}
.wk:nth-child(2){animation-delay:.2s}.wk:nth-child(3){animation-delay:.4s}
.wk svg{width:100%}
@keyframes walk{50%{transform:translateY(-5px)}}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;align-items:center}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--card)}
.dot.past{background:var(--mint);opacity:.6}
.dot.now{background:var(--gold);transform:scale(1.15)}
.pmini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pm,.pu{display:flex;gap:4px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 6px;position:relative}
.pmh{width:34px;flex:0 0 34px;height:38px;overflow:hidden}
.pmh svg{width:34px}
.pmh.big{width:64px;flex-basis:64px;height:72px}.pmh.big svg{width:64px}
.pmb{flex:1;min-width:0;font-size:12px}
.pmb b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmb small{display:block;font-size:11px;color:var(--muted)}
.bar{height:7px;border-radius:9px;background:rgba(74,48,72,.18);overflow:hidden;margin:2px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#6fdcb8,#8fe0cf);border-radius:9px;transition:width .35s}
.bar i.lo{background:linear-gradient(90deg,#ff6f91,#ff9db5)}
.bar.q i{background:repeating-linear-gradient(45deg,#7b6fb0 0 6px,#5a4c9f 6px 12px)}

/* battle */
.foes{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;align-items:flex-end;gap:1.5%;padding:0 2%}
.foe{width:31%;max-width:140px;position:relative;text-align:center;transition:opacity .4s;cursor:pointer}
.foes.boss .foe{width:58%;max-width:240px}
.fs svg{width:100%;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.fn{font-size:11px;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fst{font-size:11px;min-height:0}
.foe .bar{background:rgba(0,0,0,.35);height:6px}
.intent{position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%);white-space:nowrap;z-index:2}
.intent span{display:inline-block;background:#fffaf0;color:#4a3048;border:2px solid #4a3048;border-radius:12px;padding:1px 7px;font-size:11.5px;font-weight:700}
.intent span.w{background:var(--berry);color:#fff;animation:warn .9s infinite}
@keyframes warn{50%{transform:scale(1.08)}}
.foes.boss .intent span{font-size:13px}
.foe.dead{opacity:0;pointer-events:none;transform:scale(.8)}
.foe.pick .fs{animation:pick 1s infinite}
@keyframes pick{50%{filter:drop-shadow(0 0 10px #ffd36e) brightness(1.15)}}
.hit{animation:hit .38s}
@keyframes hit{0%,100%{transform:none;filter:none}25%{transform:translateX(-6px);filter:brightness(1.8) saturate(.4)}60%{transform:translateX(5px)}}
.heal{animation:healg .6s}
@keyframes healg{50%{box-shadow:0 0 0 4px #8fe0cf;filter:brightness(1.15)}}
.act{animation:act .3s}
@keyframes act{50%{transform:translateY(-6px)}}
.pop{position:absolute;top:20%;left:50%;transform:translateX(-50%);font-weight:900;font-size:22px;color:#fff;-webkit-text-stroke:1.5px #c2185b;pointer-events:none;animation:popn .9s forwards;z-index:3}
@keyframes popn{0%{opacity:0;transform:translate(-50%,8px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.blog{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:14px;line-height:1.6;min-height:3.4em}
.blog.live{cursor:pointer}
.prow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.pu.cur{border-color:var(--berry);box-shadow:0 0 0 2px var(--berry)}
.pu.down{opacity:.45}
.sti{font-size:10px}
.sp{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
.sp i{width:8px;height:8px;border-radius:50%;background:var(--gold);border:1px solid #c9a14a}
.sp i.e{background:transparent;border-color:var(--line)}
.who{font-weight:700;margin:6px 2px 8px;font-size:15px}
.who small{font-weight:400;color:var(--muted)}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cmds2{margin-top:8px;display:flex;justify-content:flex-start}
.win{text-align:center}
.win h3{font-size:26px;margin:4px 0;color:var(--berry)}
.win .pmini{margin:12px 0}
.win .btn{width:100%}

/* sheet / menu */
.sheet{width:100%;max-width:520px;max-height:90%;background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.tabs{display:flex;gap:6px;padding:12px 12px 0}
.tab{flex:1;font-size:16px;background:transparent;border:2px solid var(--ink);color:var(--ink);border-radius:12px 12px 0 0;padding:8px 4px;cursor:pointer}
.tab.on{background:var(--gold);color:#4a3048}
.tab.x{flex:0 0 46px}
.sbody{overflow-y:auto;padding:12px;border-top:2px solid var(--ink)}
.card{display:flex;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.cb{flex:1;font-size:13px}
.cb b{font-size:15px}
.stats{margin:2px 0 4px}
.skl{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.skl span{font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1px 6px}
.eqbox{display:flex;flex-direction:column;gap:6px;background:var(--card);border:2px dashed var(--ink);border-radius:14px;padding:10px;margin-top:6px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:1.5px dashed var(--line)}
.srow small{display:block;font-size:12px;color:var(--muted)}
.srow .own{font-size:11px;margin-left:6px;color:var(--muted)}
.srow .btn{flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#4a3048;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:80;animation:fade .3s;max-width:90%;text-align:center}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
@media (min-height:760px){ #stage{height:min(52%,400px)} }
/* Layout keeps the full illustration and enemy intent inside the stage. */
#stage{height:clamp(220px,43svh,380px);min-height:0}
.foes{bottom:16px;height:calc(100% - 64px);align-items:stretch}
.foe,.foes.boss .foe{height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.fs{height:calc(100% - 38px);min-height:0;display:flex;align-items:flex-end;justify-content:center}
.fs svg{width:auto;height:100%;max-width:100%}
.fn,.fst,.foe .bar{flex-shrink:0}
@media(max-height:430px) and (orientation:landscape){#app{max-width:900px;flex-direction:row}#stage{width:45%;height:100%;flex-shrink:0}#panel{width:55%;padding:14px 12px}}

/* Generated illustrations and a quiet, responsive storybook frame. */
:root{--line:#dfcec1}
#app{border-inline:1px solid rgba(240,223,195,.12)}
#bg .scene-bg{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
#layer{isolation:isolate}
#panel{background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 120px);padding:20px 16px 24px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#stage::after{height:10px;background-size:20px 14px}
.sprite{display:block;object-fit:contain;pointer-events:none;user-select:none}
.por{bottom:10px;width:48%;height:calc(100% - 24px);display:flex;align-items:flex-end;justify-content:center;transform:none}
.por.L{left:0}.por.R{right:0}
.por.pop{top:auto}
@media(prefers-reduced-motion:reduce){.por.pop{animation:none}}
.por .sprite{width:100%;height:100%;object-position:center bottom;filter:drop-shadow(0 3px 5px rgba(18,10,34,.18))}
.por.dim{filter:brightness(.83) saturate(.86);transform:none}
.titlecard{padding:18px;background:linear-gradient(180deg,rgba(15,12,40,.22),rgba(15,12,40,.5));justify-content:center}
.titlecard h1{font-size:clamp(34px,9vw,49px);line-height:1.28;transform:none;text-shadow:0 3px 9px #191532,0 0 30px rgba(255,214,110,.35)}
.tsub{text-shadow:0 2px 4px #191532;letter-spacing:.13em}
.tb{border-width:2px;padding:22px 16px 24px;font-size:16px;line-height:1.85;box-shadow:0 4px 14px rgba(55,28,56,.05)}
.tb.louv .tx{font-size:18px}
.tb .nm{border-width:2px;padding:2px 14px}
.btn{border-width:2px;box-shadow:0 3px 0 var(--ink);font-size:15px}
.btn.sm{font-size:13px;min-height:44px}
.npcs{left:4%;right:4%;bottom:12px;gap:8px;grid-template-columns:repeat(var(--npc-cols),minmax(0,1fr));align-items:end}
.npc .sprite{width:100%;max-width:92px;height:112px;filter:drop-shadow(0 2px 3px rgba(32,20,42,.16))}
.npc .lbl{margin-top:2px;font-size:10px;line-height:1.5;padding:2px 5px;box-shadow:0 1px 4px rgba(20,16,30,.1)}
.npc .ico{display:flex;align-items:center;justify-content:center;width:100%;height:112px}
.wk .sprite{width:100%;height:140px;filter:drop-shadow(0 3px 4px rgba(32,20,42,.16))}
.pmini,.prow{gap:5px}
.pm,.pu{padding:6px 5px;gap:5px;flex-direction:row;align-items:center}
.pmh{width:30px;height:36px;flex:0 0 30px;align-self:center;overflow:visible}
.pmh .sprite{width:100%;height:100%;border-radius:10px}
.pmh.big{width:66px;height:66px;flex-basis:auto;align-self:flex-start}
.card .cb{min-width:0}
.pmb b{text-align:center;font-size:12px}
.pmb small{font-size:10px;white-space:nowrap;text-align:center}
.sp{justify-content:flex-start;gap:3px}
.sti:not(:empty){display:block;font-size:10px}
.bar{height:6px;margin:4px 0}
.intent{position:static;transform:none;flex:0 0 auto;margin-bottom:4px}
.fs{height:auto;aspect-ratio:1;width:100%;flex:0 1 auto;max-height:calc(100% - 64px)}
.fs .sprite{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 3px 4px rgba(12,8,30,.2))}
.foes.boss .foe{width:76%;max-width:300px}
.fn{font-size:12px;font-weight:700;white-space:normal;line-height:1.25;text-shadow:0 1px 3px #161026,0 0 5px #161026}
.fst{line-height:1.2}
.foes .bar{max-width:180px;width:90%;align-self:center;margin-top:4px}
.intent span{font-size:11px;max-width:calc(100vw / 3 - 8px);padding:3px 6px;border-width:1.5px}
.foes.boss .intent span{font-size:12px;max-width:260px}
.blog{border-width:1.5px;font-size:13px;min-height:3.3em;background:var(--card)}
.ph{gap:12px;align-items:center}.ph h3{font-size:20px;line-height:1.3}.ph .gold{white-space:nowrap}
.art-unavailable{display:flex;width:100%;height:100%;align-items:center;justify-content:center;color:var(--gold)}
@media(max-width:360px){#panel{padding:18px 12px 22px}.tb{font-size:15px}.tb.louv .tx{font-size:17px}.ph h3{font-size:18px}.pmb b{font-size:11px}.pmh{width:24px;flex-basis:24px}.npc .sprite,.npc .ico{height:92px}}
@media(max-height:430px) and (orientation:landscape){#panel{padding:16px 12px 20px}.por{height:calc(100% - 24px)}.tb{font-size:14px;min-height:90px}.npcs{grid-template-columns:repeat(var(--npc-cols),minmax(0,1fr));gap:4px}.npc .sprite,.npc .ico{height:95px}.wk .sprite{height:130px}.titlecard h1{font-size:30px}.sheet{max-width:900px;max-height:94%}}

</style></head>
<body><div id="app"><div id="stage"><div id="bg"></div><div id="layer"></div><div id="fx"></div></div><div id="panel"></div></div><div id="overlay"></div>
<script>// ===== ENGINE (DOM-free) =====
const R = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const CHARS = {

// ---- units ----
function partyUnit(G, id) {
  const c = CHARS[id], b = G.bonus, a = ACCS[G.acc[id]] || {};
  const tz = (id === 'mashu' && G.flags.toast) ? { hp: 12, def: 3, atk: 2 } : {};
  const u = {
    id, name: c.name, ally: true,
    maxhp: c.hp + b.hp + (a.hp || 0) + (tz.hp || 0),
    atk: c.atk + b.atk + (a.atk || 0) + (tz.atk || 0),
    def: c.def + b.def + (a.def || 0) + (tz.def || 0),
    spd: c.spd + (a.spd || 0),
    maxsp: c.sp + b.sp + (a.sp || 0),
    immune: !!a.immune, endure: !!a.endure,
    skills: c.skills.slice(), st: {},
  };
  if (id === 'lou' && G.flags.voice) u.skills.unshift('sing');
  const h = G.hp[id];
  u.hp = (h == null) ? u.maxhp : clamp(h, 1, u.maxhp);
  u.sp = u.maxsp;
  return u;
}
function enemyUnit(id) {
  const e = ENEMIES[id];
  return {
    id, key: id, name: e.name, maxhp: e.hp, hp: e.hp, atk: e.atk, def: e.def, spd: e.spd,
    pat: e.pat, pi: e.boss ? 0 : R(e.pat.length), st: {}, spr: e.spr, g: e.g, boss: !!e.boss, hideHp: !!e.hideHp, intent: null,
  };
}
const alive = arr => arr.filter(u => u.hp > 0);

function newBattle(G, ids, opts = {}) {
  const party = G.party.map(id => partyUnit(G, id));
  const cnt = {};
  ids.forEach(i => cnt[i] = (cnt[i] || 0) + 1);
  const seen = {};
  const enemies = ids.map((i, n) => {
    const u = enemyUnit(i);
    u.uid = 'e' + n;
    if (cnt[i] > 1) { seen[i] = (seen[i] || 0) + 1; u.name += 'ABC'[seen[i] - 1]; }
    return u;
  });
  if (opts.hpMod) enemies.forEach(e => { if (e.boss) { e.hp += opts.hpMod; e.maxhp += opts.hpMod; } });
  if (opts.atkMod) enemies.forEach(e => { e.atk += opts.atkMod; });
  party.forEach(u => u.uid = u.id);
  const B = { party, enemies, round: 1, over: null, opts, voices: opts.voices || 0 };
  plan(B);
  return B;
}

function effAtk(u) { return u.atk + (u.st.atkU ? 3 : 0) - (u.st.atkD ? 2 : 0); }
function effDef(u) { return Math.max(0, u.def + (u.st.defU ? 2 : 0) - (u.st.defD ? 2 : 0)); }
function calc(a, t, m = 1) { return Math.max(1, Math.round(effAtk(a) * m) - effDef(t)); }
function vary(d) { return Math.max(1, d + R(3) - 1); }

function plan(B) {
  for (const e of alive(B.enemies)) {
    if (e.st.sleep > 0) { e.intent = { k: 'zzz' }; continue; }
    const it = Object.assign({}, e.pat[e.pi % e.pat.length]);
    e.pi++;
    if (['atk', 'big', 'poison', 'sleep', 'drain'].includes(it.k)) it.target = pickTarget(B, it.tgt);
    e.intent = it;
  }
}
function pickTarget(B, mode) {
  const a = alive(B.party);
  if (!a.length) return null;
  if (mode === 'low') return a.reduce((x, y) => (y.hp / y.maxhp < x.hp / x.maxhp ? y : x));
  return a[R(a.length)];
}

function intentInfo(B, e) {
  const it = e.intent; if (!it) return { ic: '', tx: '' };
  const tn = it.target ? it.target.name : '';
  const d = t => calc(e, t, it.m || 1);
  switch (it.k) {
    case 'atk': return { ic: '⚔️', tx: `${d(it.target)}→${tn}`, warn: false };
    case 'big': return { ic: '💥', tx: `${d(it.target)}→${tn}`, warn: true };
    case 'all': { const a = alive(B.party); const mx = Math.max(...a.map(d)); return { ic: '🌊', tx: `${mx}ぜんいん`, warn: (it.m || 1) >= 1.2 }; }
    case 'charge': return { ic: '✨', tx: 'ためている', warn: true };
    case 'poison': return { ic: '☠️', tx: `どく→${tn}` };
    case 'sleep': return { ic: '💤', tx: `ねむり→${tn}` };
    case 'sleepAll': return { ic: '💤', tx: 'ぜんいんねむり' };
    case 'heal': return { ic: '💗', tx: 'かいふく' };
    case 'defup': return { ic: '🛡️', tx: 'かたくなる' };
    case 'atkup': return { ic: '🔥', tx: 'パワーアップ' };
    case 'drain': return { ic: '🌀', tx: `${d(it.target)}+SP→${tn}` };
    case 'wait': return { ic: '…', tx: 'ようすみ' };
    case 'zzz': return { ic: '💤', tx: 'ねむっている' };
  }
  return { ic: '?', tx: '' };
}

// returns array of text lines
function hurt(B, t, d) {
  const out = [];
  t.hp -= d;
  if (t.hp <= 0) {
    if (t.ally && t.endure && !t.endUsed) { t.endUsed = true; t.hp = 1; out.push(`${t.name}は ベールのちからで ふみとどまった！`); }
    else { t.hp = 0; t.st = {}; out.push(t.ally ? `${t.name}は たおれてしまった…` : `${t.name}を たおした！`); }
  }
  return out;
}
function heal(t, n) { const b = t.hp; t.hp = Math.min(t.maxhp, t.hp + n); return t.hp - b; }

function* resolve(B, cmds) {
  const P = B.party, E = B.enemies;
  P.forEach(u => { u.guard = false; u.cover = false; });
  const done = new Set();
  for (const u of alive(P)) {
    const c = cmds[u.id]; if (!c || u.st.sleep > 0) continue;
    if (c.k === 'guard') { u.guard = true; u.sp = Math.min(u.maxsp, u.sp + 1); done.add(u.id); yield { m: `${u.name}は みをまもっている（SP+1）`, who: u.uid }; }
    else if (c.k === 'skill' && SKILLS[c.id].prio) { done.add(u.id); yield* doSkill(B, u, c); }
  }
  const actors = [...alive(P).filter(u => cmds[u.id] && !done.has(u.id)), ...alive(E)]
    .sort((a, b) => (b.spd - a.spd) || (a.ally ? -1 : 1));
  for (const u of actors) {
    if (u.hp <= 0 || B.over) continue;
    if (u.st.sleep > 0) { u.st.sleep--; yield { m: `${u.name}は ねむっている…`, who: u.uid }; continue; }
    if (u.ally) yield* doPlayer(B, u, cmds[u.id]);
    else yield* doEnemy(B, u);
    checkOver(B);
  }
  if (!B.over) { yield* endRound(B); checkOver(B); }
  if (!B.over && B.opts.endRound && B.round >= B.opts.endRound) B.over = 'script';
  if (!B.over) { B.round++; plan(B); }
}
function checkOver(B) {
  if (!alive(B.enemies).length) B.over = 'win';
  else if (!alive(B.party).length) B.over = B.opts.noLose ? 'script' : 'lose';
}
function liveTarget(arr, t) { if (t && t.hp > 0) return t; const a = alive(arr); return a.length ? a[R(a.length)] : null; }

function* doPlayer(B, u, c) {
  if (!c) return;
  if (c.k === 'atk') {
    const t = liveTarget(B.enemies, B.enemies.find(e => e.uid === c.t)); if (!t) return;
    const d = vary(calc(u, t, 1));
    yield { m: `${u.name}の こうげき！ ${t.name}に ${d}ダメージ`, hit: t.uid, n: d, who: u.uid, extra: hurt(B, t, d) };
  } else if (c.k === 'skill') yield* doSkill(B, u, c);
  else if (c.k === 'item') yield* doItem(B, u, c);
}
function* doSkill(B, u, c) {
  const s = SKILLS[c.id];
  if (u.sp < s.sp) { yield { m: `${u.name}は SPがたりない！` }; return; }
  u.sp -= s.sp;
  const P = B.party, E = B.enemies;
  switch (c.id) {
    case 'hoshinage': case 'meteor': {
      const lines = []; const hits = [];
      for (const t of alive(E)) { const d = vary(calc(u, t, s.m)); hits.push(t.uid); lines.push(`${t.name}に ${d}`, ...hurt(B, t, d)); }
      yield { m: `${u.name}の ${s.name}！ ` + lines.filter(l => !l.includes('たおした')).join('、'), hitAll: hits, who: u.uid, extra: lines.filter(l => l.includes('たおした')), big: true }; break;
    }
    case 'beam': {
      const t = liveTarget(E, E.find(e => e.uid === c.t)); if (!t) return;
      const d = vary(calc(u, t, s.m));
      yield { m: `${u.name}の まおうビーム！ ${t.name}に ${d}ダメージ`, hit: t.uid, n: d, who: u.uid, extra: hurt(B, t, d), big: true }; break;
    }
    case 'zurui': {
      const t = liveTarget(E, E.find(e => e.uid === c.t)); if (!t) return;
      t.st.atkD = 3; t.st.defD = 3;
      yield { m: `${u.name}の ずるいまほう！ ${t.name}の 攻撃と防御が さがった`, hit: t.uid, who: u.uid, debuff: true }; break;
    }
    case 'gyu': {
      let t = P.find(p => p.uid === c.t); if (!t || t.hp <= 0) t = alive(P).reduce((x, y) => y.hp / y.maxhp < x.hp / x.maxhp ? y : x);
      const h = heal(t, s.heal); delete t.st.poison; delete t.st.sleep;
      yield { m: `${u.name}は ${t.name}を ぎゅっとした。 HPが ${h} かいふく`, heal: t.uid, who: u.uid }; break;
    }
    case 'negai': {
      const dead = P.filter(p => p.hp <= 0);
      if (dead.length) { const t = dead.find(p => p.uid === c.t) || dead[0]; t.hp = Math.ceil(t.maxhp / 2); yield { m: `${u.name}の ねがいぼし！ ${t.name}が ふっかつした！`, heal: t.uid, who: u.uid }; }
      else { alive(P).forEach(p => heal(p, 8)); yield { m: `${u.name}の ねがいぼし！ みんなのHPが 8 かいふく`, healAll: true, who: u.uid }; }
      break;
    }
    case 'kabau': u.cover = true; yield { m: `${u.name}は みんなの まえに たちはだかった！`, who: u.uid }; break;

const AU = {
  ctx: null, kind: null, timer: null, step: 0, nextT: 0, songT: [],
  init() {

    if (!this.ctx || !OPT.sound) return;

    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.mg); o.start(t); o.stop(t + d + .05);
  },
  sfx(k) {
    if (!this.ctx || !OPT.sound) return;
    const t = this.ctx.currentTime;
    if (k === 'tap') this.note(84, t, .08, 'sine', .06);
    else if (k === 'hit') { this.note(50, t, .12, 'square', .07); this.note(45, t + .04, .12, 'square', .05); }
    else if (k === 'big') { this.note(40, t, .3, 'sawtooth', .08); this.note(35, t + .06, .35, 'square', .06); }
    else if (k === 'heal') [72, 76, 79, 84].forEach((n, i) => this.note(n, t + i * .06, .25, 'sine', .07));
    else if (k === 'win') [72, 76, 79, 84, 79, 84].forEach((n, i) => this.note(n, t + i * .1, .35, 'triangle', .08));
    else if (k === 'get') [79, 84, 88].forEach((n, i) => this.note(n, t + i * .08, .3, 'sine', .08));
    else if (k === 'lose') [64, 60, 57, 52].forEach((n, i) => this.note(n, t + i * .25, .6, 'triangle', .08));
  },
  P: {
    field: { tempo: .3, ch: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]], pat: [0, 1, 2, 1, 0, 2, 1, 2], oct: 12, wave: 'sine', v: .05, bass: 4 },
    dungeon: { tempo: .3, ch: [[57, 60, 64], [55, 59, 62], [53, 57, 60], [52, 56, 59]], pat: [0, 2, 1, 2, 0, 2, 1, 0], oct: 12, wave: 'sine', v: .045, bass: 4 },
    battle: { tempo: .15, ch: [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 56, 59]], pat: [0, 1, 2, 1, 0, 1, 2, 3, 0, 1, 2, 1, 3, 2, 1, 0], oct: 0, wave: 'triangle', v: .05, bass: 2 },
    boss: { tempo: .135, ch: [[57, 60, 64], [57, 60, 65], [55, 59, 62], [56, 59, 64]], pat: [0, 2, 1, 2, 0, 2, 1, 3, 0, 2, 1, 2, 3, 2, 1, 2], oct: 0, wave: 'square', v: .028, bass: 1 },
    final: { tempo: .2, ch: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]], pat: [0, 1, 2, 3, 2, 1, 0, 2], oct: 12, wave: 'triangle', v: .05, bass: 2 },
  },

let SR = null;
function runScene(lines, done) {
  if (SR) clearInterval(SR.tm);
  mode = 'scene';
  SR = { stack: [{ a: lines, i: 0 }], done, L: null, R: null, side: 'R', typing: false, wait: false };
  layer(`<div class="por L"></div><div class="por R"></div>`);
  placePor('lou', 'n');
  sceneNext();
}
function clearPor() { if (!SR) return; SR.L = SR.R = null; SR.side = 'R'; document.querySelectorAll('.por').forEach(p => { p.innerHTML = ''; p.className = p.className.replace(/ ?(on|dim|pop)/g, ''); delete p.dataset.k; }); placePor('lou', 'n'); }
function sceneNext() {
  if (!SR) return;
  const top = SR.stack[SR.stack.length - 1];
  if (!top) { const d = SR.done; SR = null; d && d(); return; }
  if (top.i >= top.a.length) { SR.stack.pop(); return sceneNext(); }
  const c = top.a[top.i++];
  if (typeof c === 'string') return showLine(c);
  const push = arr => { if (arr && arr.length) SR.stack.push({ a: arr, i: 0 }); };
  if (c.por) { placePor(c.por, c.ex || 'n'); return sceneNext(); }
  if (c.bg) { setBg(c.bg); clearPor(); return sceneNext(); }
  if (c.fx) { fx(c.fx); SR.wait = true; return setTimeout(() => { if (SR) { SR.wait = false; sceneNext(); } }, 450); }
  if (c.music) { if (c.music === 'song') AU.song(); else AU.bgm(null); return sceneNext(); }
  if (c.set) { G.flags[c.set] = true; return sceneNext(); }
  if (c.if) { push(cond(c.if) ? c.then : c.else); return sceneNext(); }
  if (c.take) { G.items[c.take] = Math.max(0, (G.items[c.take] || 0) - 1); return sceneNext(); }
  if (c.join) { if (!G.party.includes(c.join)) { G.party.push(c.join); G.party.sort((a, b) => ['lou', 'choco', 'mashu'].indexOf(a) - ['lou', 'choco', 'mashu'].indexOf(b)); } G.hp[c.join] = null; return sceneNext(); }
  if (c.leave) { G.party = G.party.filter(p => p !== c.leave); return sceneNext(); }
  if (c.give) { const got = []; for (const k in c.give) { G.items[k] = (G.items[k] || 0) + c.give[k]; got.push(`${ITEMS[k].name}${c.give[k] > 1 ? '×' + c.give[k] : ''}`); } AU.sfx('get'); return sysLine(`${got.join('、')} を てにいれた！`); }
  if (c.acc) { if (!G.accOwned.includes(c.acc)) G.accOwned.push(c.acc); AU.sfx('get'); return sysLine(`アクセサリ「${ACCS[c.acc].name}」を てにいれた！ （${ACCS[c.acc].desc}）\nメニューの「なかま」で そうびできる`); }
  if (c.grow) {
    const g = c.grow, parts = []; for (const k in g) if (g[k]) { G.bonus[k] += g[k]; parts.push({ hp: 'HP', atk: '攻撃', def: '防御', sp: 'SP' }[k] + '+' + g[k]); }
    healAll(); AU.sfx('heal');
    return sysLine(`ブローチが、かすかにひかった。\nちからが、わいてくる。（みんなの ${parts.join(' ')}）`);
  }
  if (c.title) return titleCard(c.title);
  if (c.choice) return showChoice(c.choice);
  if (c.battle) { const d = SR.done; SR = null; startBattle(c.battle, {}, () => runScene(SC[c.win], d)); return; }
  sceneNext();
}
function showChoice(list) {

  panel(h);
}
function setCmd(c) { const u = curU(); BT.cmds[u.id] = c; if (c.k === 'item') BT.res[c.id] = (BT.res[c.id] || 0) + 1; BT.ci++; AU.sfx('tap'); if (BT.ci >= BT.pend.length) execute(); else renderCmd(); }
function cmdAct(a) {
  const u = curU(), B = BT.B;
  if (a === 'atk') { const al = alive(B.enemies); if (al.length === 1) return setCmd({ k: 'atk', t: al[0].uid }); return renderCmd({ k: 'tgtE', then: t => ({ k: 'atk', t }) }); }
  if (a === 'guard') return setCmd({ k: 'guard' });
  if (a === 'skill') return renderCmd({ k: 'skill' });
  if (a === 'item') return renderCmd({ k: 'item' });
  if (a === 'back') return renderCmd();
  if (a === 'prev') { BT.ci--; const pu = curU(); const pc = BT.cmds[pu.id]; if (pc && pc.k === 'item') BT.res[pc.id]--; delete BT.cmds[pu.id]; return renderCmd(); }
}
function pickSkill(id) {
  const s = SKILLS[id], B = BT.B;
  if (s.tgt === 'enemy') { const al = alive(B.enemies); if (al.length === 1) return setCmd({ k: 'skill', id, t: al[0].uid }); return renderCmd({ k: 'tgtE', then: t => ({ k: 'skill', id, t }) }); }
  if (s.tgt === 'ally') return renderCmd({ k: 'tgtA', then: t => ({ k: 'skill', id, t }) });
  if (id === 'negai') { const dead = B.party.filter(p => p.hp <= 0); if (dead.length > 1) return renderCmd({ k: 'tgtA', dead: true, then: t => ({ k: 'skill', id, t }) }); return setCmd({ k: 'skill', id, t: dead[0] && dead[0].uid }); }
  setCmd({ k: 'skill', id });
}
function pickItem(k) {
  const it = ITEMS[k], B = BT.B;
  if (it.tgt === 'ally') return renderCmd({ k: 'tgtA', then: t => ({ k: 'item', id: k, t }) });
  if (it.tgt === 'dead') { const dead = B.party.filter(p => p.hp <= 0); if (!dead.length) { toast('たおれている仲間がいない'); return; } if (dead.length > 1) return renderCmd({ k: 'tgtA', dead: true, then: t => ({ k: 'item', id: k, t }) }); return setCmd({ k: 'item', id: k, t: dead[0].uid }); }
  setCmd({ k: 'item', id: k });
}
function chooseTarget(uid, ally) {
  if (!BT || !BT.sel || !BT.sel.then) return;
  if (ally !== (BT.sel.k === 'tgtA')) return;
  if (ally) { const p = BT.B.party.find(x => x.uid === uid); if (!p) return; if (BT.sel.dead ? p.hp > 0 : p.hp <= 0) return; }
  else { const e = BT.B.enemies.find(x => x.uid === uid); if (!e || e.hp <= 0) return; }
  setCmd(BT.sel.then(uid));
}
function execute() {
  BT.gen = resolve(BT.B, BT.cmds); BT.busy = true;
  document.querySelectorAll('.foe').forEach(f => f.classList.remove('pick'));
  panel(`<div class="blog live" data-act="skip"></div>${partyRows()}<p class="hint">タップで はやおくり</p>`);
  stepExec();
}
function stepExec() {
  clearTimeout(BT.tm);
  const r = BT.gen.next();
  if (r.done) { BT.busy = false; return afterRound(); }
  const ev = r.value;
  BT.log = ev.m + (ev.extra && ev.extra.length ? '\n' + ev.extra.join('\n') : '');
  const lg = $('#panel .blog'); if (lg) lg.innerHTML = esc(BT.log).replace(/\n/g, '<br>');
  const pr = $('#panel .prow'); if (pr) pr.outerHTML = partyRows();
  updFoes();
  const bump = (uid, cls, n) => { const el = $('#u_' + uid); if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); if (n != null) { const p = document.createElement('span'); p.className = 'pop ' + (cls === 'heal' ? 'g' : ''); p.textContent = n; el.appendChild(p); setTimeout(() => p.remove(), 900); } };
  if (ev.who) bump(ev.who, 'act');
  if (ev.hit) bump(ev.hit, 'hit', ev.n);
  if (ev.hitAll) ev.hitAll.forEach(u => bump(u, 'hit'));
  if (ev.heal) bump(ev.heal, 'heal');
  if (ev.healAll) BT.B.party.forEach(u => bump(u.uid, 'heal'));
  if (ev.big) fx('shake'); else if (ev.hit || ev.hitAll) AU.sfx('hit');
  if (ev.heal || ev.healAll) AU.sfx('heal');
  if (ev.song) { fx('flash'); AU.sfx('heal'); }
  const base = OPT.fast ? 550 : 950;
  BT.tm = setTimeout(stepExec, base + (ev.extra && ev.extra.length ? 300 : 0));
}
function skipExec() { if (BT && BT.busy) stepExec(); }
function afterRound() {
  const B = BT.B;
  if (B.over) return finishBattle();
  beginInput();
}
function finishBattle() {
  const B = BT.B, o = B.over;
  if (o === 'lose') return gameOver();
  B.party.forEach(p => G.hp[p.id] = Math.max(1, p.hp));
  updFoes();
  if (o === 'script') { const cb = BT.cb; BT = null; return cb(); }
  const g = B.enemies.reduce((s, e) => s + e.g, 0);
  G.gold += g; AU.bgm(null); AU.sfx('win');
  mode = 'won';
  panel(`<div class="win"><h3>しょうり！</h3><p>${g} ポムを てにいれた</p>${partyMini()}<button class="btn pri" data-act="wonok">つづける</button></div>`);
}
function gameOver() {
  mode = 'over'; AU.bgm(null); AU.sfx('lose');
  layer(`<div class="por R on">${chibi('meme', 'n')}</div>`);
  panel(`<div class="tb"><div class="tx">ルゥたちは、たおれてしまった……<br><br>メェメ「……めぇ。まだ、日記はおわってないよ」</div></div>
  <div class="choices"><button class="btn pri" data-act="retry">このたたかいを やりなおす</button><button class="btn" data-act="reload">日記（セーブ）から やりなおす</button><button class="btn ghost" data-act="title">タイトルへ</button></div>
  <p class="hint">ヒント：💥や✨のマークは大技の合図。ねらわれた仲間は「まもる」、マシュの「かばう」も有効</p>`);
}
function retry() { const b = BT; G = JSON.parse(b.snap); startBattle(b.ids, b.opts, b.cb); }

// ---------- menu ----------
let MT = 'party';
function openMenu(tab) {
  MT = tab || MT; AU.sfx('tap');
  const o = $('#overlay'); o.classList.add('show');
  let h = `<div class="sheet"><div class="tabs">${[['party', 'なかま'], ['items', 'どうぐ'], ['opt', 'せってい']].map(([k, l]) => `<button class="tab ${MT === k ? 'on' : ''}" data-act="mt:${k}">${l}</button>`).join('')}<button class="tab x" data-act="mclose" aria-label="とじる">✕</button></div><div class="sbody">`;
  if (MT === 'party') {
    h += G.party.map(id => {
      const u = partyUnit(G, id); const hp = u.hp; const a = G.acc[id];
      return `<div class="card"><div class="pmh big">${chibi(spriteFor(id), 'h', true)}</div><div class="cb"><b>${u.name}</b>${hpBar({ hp, maxhp: u.maxhp })}<small>HP ${hp}/${u.maxhp}　SP ${u.maxsp}</small><div class="stats">攻撃 ${u.atk}　防御 ${u.def}　すばやさ ${u.spd}</div>
      <div class="skl">${u.skills.map(s => `<span title="${esc(SKILLS[s].desc)}">${SKILLS[s].name}</span>`).join('')}</div>
      <button class="btn sm" data-act="eq:${id}">✦ ${a ? esc(ACCS[a].name) : 'アクセサリなし'}</button></div></div>`;
    }).join('');
    if (MT === 'party' && menuEq.who) {
      const who = menuEq.who;
      const free = G.accOwned.filter(k => !Object.entries(G.acc).some(([c, v]) => v === k && c !== who));
      h += `<div class="eqbox"><b>${CHARS[who].name} の アクセサリ</b>${free.length ? free.map(k => `<button class="btn li ${G.acc[who] === k ? 'here' : ''}" data-act="eqs:${who}:${k}"><b>${ACCS[k].name}</b><small>${esc(ACCS[k].desc)}</small></button>`).join('') : '<p class="hint">まだアクセサリをもっていない</p>'}<button class="btn sm ghost" data-act="eqs:${who}:">はずす</button></div>`;
    }
  } else if (MT === 'items') {
    const ks = Object.keys(G.items).filter(k => G.items[k] > 0);
    h += `<p class="gold">${G.gold} ポム</p>` + (ks.length ? ks.map(k => `<div class="srow"><div><b>${ITEMS[k].name}</b><span class="own">×${G.items[k]}</span><small>${esc(ITEMS[k].desc)}</small></div>${['candy', 'honey'].includes(k) && mode !== 'battle' ? `<button class="btn sm" data-act="use:${k}">つかう</button>` : ''}</div>`).join('') : '<p class="hint">なにももっていない</p>');
    if (useMenu.k) h += `<div class="eqbox"><b>だれにつかう？</b>${G.party.map(id => { const u = partyUnit(G, id); const hp = u.hp; return `<button class="btn sm" data-act="uset:${id}">${u.name}（${hp}/${u.maxhp}）</button>`; }).join('')}</div>`;
  } else {
    h += `<div class="menu-col"><button class="btn" data-act="opt:sound">おと：${OPT.sound ? 'あり' : 'なし'}</button><button class="btn" data-act="opt:fast">文字・たたかいの速さ：${OPT.fast ? 'はやい' : 'ふつう'}</button>
     <p class="hint">セーブは、ひつじのメェメに話しかけると できます。<br>プレイ時間 ${fmtTime(G.time)}</p><button class="btn ghost" data-act="totitle">タイトルへもどる（セーブしていない進行はきえます）</button></div>`;
  }
  h += `</div></div>`;
  o.innerHTML = h;
}
function menuEq(who) { menuEq.who = menuEq.who === who ? null : who; openMenu('party'); }
function useMenu(k) { useMenu.k = k; if (k === 'honey') { useItemOn(null); } else openMenu('items'); }
function useItemOn(id) {
  const k = useMenu.k; if (!k || !(G.items[k] > 0)) return;
  const heal1 = (pid, n) => { const u = partyUnit(G, pid); const hp = u.hp; G.hp[pid] = Math.min(u.maxhp, hp + n); };
  if (k === 'candy') heal1(id, ITEMS.candy.heal); else G.party.forEach(p => heal1(p, ITEMS.honey.healAll));
  G.items[k]--; useMenu.k = null; AU.sfx('heal'); toast(`${ITEMS[k].name}を つかった`);
  openMenu('items');
}
function closeMenu() { const o = $('#overlay'); o.classList.remove('show'); o.innerHTML = ''; menuEq.who = null; useMenu.k = null; if (mode === 'dungeon') renderDungeon(); else if (mode === 'area') renderArea(); else if (mode === 'map') renderMap(); }

// ---------- results ----------
function results() {
  mode = 'end'; AU.bgm('field'); setBg('village_night');
  const v = voices();
  layer(`<div class="titlecard small"><h1>ルゥと<br>月のこもりうた</h1></div>`);
  panel(`<div class="win"><h3>クリアおめでとう！</h3><p>プレイ時間　${fmtTime(G.time)}</p><p>とどいた うたごえ　${v} / ${VOICE_FLAGS.length}</p><p class="hint">${v === VOICE_FLAGS.length ? 'すべての声が、ルゥの歌にかさなりました。' : 'まだ、どこかに とどけられなかった声があるみたい。'}</p><p>あそんでくれて、ありがとう。</p><button class="btn pri" data-act="title">タイトルへ</button></div>`);
}

// ---------- input dispatch ----------
document.addEventListener('click', ev => {
  AU.init();
  const el = ev.target.closest('[data-act]');
  if (!el) { if (mode === 'scene' && ev.target.closest('#app')) advance(); else if (BT && BT.busy && ev.target.closest('#app')) skipExec(); return; }
  if (el.disabled) return;
  const a = el.dataset.act; const [k, v, w] = a.split(':');
  switch (k) {
    case 'new': if (loadSave()) { panel(`<div class="tb"><div class="tx">セーブデータがあります。はじめからにしますか？（いまのセーブは、つぎにメェメに日記を書いてもらうと上書きされます）</div></div><div class="choices"><button class="btn pri" data-act="newok">はじめから</button><button class="btn" data-act="title">もどる</button></div>`); return; } startNew(); break;
    case 'newok': startNew(); break;
    case 'cont': G = loadSave(); if (G) resume(); break;
    case 'sound': OPT.sound = !OPT.sound; saveOpt(); titleScreen(); break;
    case 'adv': advance(); break;
    case 'choose': choose(+v); break;
    case 'tcard': closeTitleCard(); break;
    case 'npc': if (mode === 'area') talkNpc(v); break;
    case 'map': AU.sfx('tap'); renderMap(); break;
    case 'go': if (mode === 'map') goLoc(v); break;
    case 'menu': openMenu(); break;
    case 'mt': openMenu(v); break;
    case 'mclose': closeMenu(); break;
    case 'eq': menuEq(v); break;
    case 'eqs': if (w) { for (const c in G.acc) if (G.acc[c] === w) delete G.acc[c]; G.acc[v] = w; } else delete G.acc[v]; G.party.forEach(id => { if (G.hp[id] != null) G.hp[id] = partyUnit(G, id).hp; }); menuEq.who = null; AU.sfx('get'); openMenu('party'); break;
    case 'use': useMenu(v); break;
    case 'uset': useItemOn(v); break;
    case 'opt': OPT[v] = !OPT[v]; saveOpt(); openMenu('opt'); break;
    case 'totitle': el.outerHTML = `<button class="btn pri" data-act="totitle2">ほんとうに タイトルへもどる</button>`; break;
    case 'totitle2': closeMenu(); BT = null; SR = null; titleScreen(); break;
    case 'memesave': memeSave(); break;
    case 'back': AU.sfx('tap'); if (mode === 'meme' && memeMenu.back) { const b = memeMenu.back; memeMenu.back = null; b(); } else if (G.cur) renderDungeon(); else renderArea(); break;
    case 'buy': buy('i', v, w); break;
    case 'buya': buy('a', v, w); break;
    case 'buyk': buy('k', v, w); break;
    case 'dun': enterDungeon(); break;
    case 'dunok': enterDungeon.ok = true; enterDungeon(); break;
    case 'step': if (mode === 'dungeon') doStep(); break;
    case 'br': if (mode === 'branch') branch(v); break;
    case 'exitdun': G.cur = null; renderArea(); break;
    case 'c': if (BT && !BT.busy) cmdAct(v); break;
    case 'sk': if (BT && !BT.busy) pickSkill(v); break;
    case 'it': if (BT && !BT.busy) pickItem(v); break;
    case 'tgt': if (BT && !BT.busy) chooseTarget(v, false); break;
    case 'atgt': if (BT && !BT.busy) chooseTarget(v, true); else if (BT && BT.busy) skipExec(); break;
    case 'skip': skipExec(); break;
    case 'wonok': { AU.sfx('tap'); const cb = BT.cb; BT = null; cb(); break; }
    case 'retry': retry(); break;
    case 'reload': { const s = loadSave(); if (s) { G = s; BT = null; resume(); } else titleScreen(); break; }
    case 'title': BT = null; titleScreen(); break;
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && mode === 'scene' && !e.target.closest('button')) { e.preventDefault(); advance(); } });
document.addEventListener('error', event => {
  const image = event.target;
  if (!(image instanceof HTMLImageElement) || !image.classList.contains('sprite') && !image.classList.contains('scene-bg')) return;
  image.style.visibility = 'hidden';
  if (!document.body.dataset.artWarning) {
    document.body.dataset.artWarning = '1';
    toast('画像を読み込めませんでした。assetsフォルダもHTMLと一緒に保存してください');
  }
}, true);
titleScreen();
</script></body></html>
